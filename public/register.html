<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RestoRasa — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="nav">
    <a class="logo" href="index.html">RestoRasa<span>.</span></a>
    <nav class="links" id="links">
      <a href="index.html">Beranda</a>
      <a href="menu.html">Menu</a>
      <a href="paket.html">Paket</a>
      <a href="reservasi.html">Reservasi</a>
      <a href="pesan.html">Pesanan <b class="badge" id="badge">0</b></a>
      <a href="login.html" id="authLink" class="active">Masuk</a>
    </nav>
    <span class="crumb">10 / REGISTER</span>
    <button class="burger" id="burger" aria-label="Buka menu">☰</button>
  </header>

  <main>
    <section class="page authwrap panel">
      <div class="auth-head">
        <a class="logo" href="index.html">RestoRasa<span>.</span></a>
        <h2>Buat akun <em>baru.</em></h2>
        <p class="sub">Isi data di bawah untuk mendaftar.</p>
      </div>

      <form id="regForm">
        <div class="field">
          <label for="gName">Nama Lengkap</label>
          <input id="gName" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="field">
          <label for="gEmail">Email</label>
          <input id="gEmail" type="email" placeholder="Masukkan email" required>
        </div>
        <div class="field">
          <label for="gPass">Password</label>
          <input id="gPass" type="password" minlength="6" placeholder="Minimal 6 karakter" required>
        </div>
        <div class="field">
          <label for="gPass2">Konfirmasi Password</label>
          <input id="gPass2" type="password" placeholder="Ulangi password" required>
        </div>
        <div class="err" id="err"></div>
        <button class="btn orange block" type="submit">Daftar</button>
      </form>

      <p class="sub auth-note">Sudah punya akun? <a class="link" href="login.html">Login di sini</a></p>
    </section>
  </main>

  <footer class="foot">
    <a class="logo" href="index.html">RestoRasa<span>.</span></a>
    <p>Jl. Merdeka No. 123, Cilegon · Buka 10.00 – 22.00 WIB · +62 812 3456 7890</p>
    <span class="mono">© 2026 RestoRasa</span>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
