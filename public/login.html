<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RestoRasa — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="nav">
    <a class="logo" href="index.html">RestoRasa<span>.</span></a>
    <nav class="links" id="links">
      <a href="index.html">Beranda</a>
      <a href="menu.html">Menu</a>
      <a href="paket.html">Paket</a>
      <a href="reservasi.html">Reservasi</a>
      <a href="pesan.html">Pesanan <b class="badge" id="badge">0</b></a>
      <a href="login.html" id="authLink" class="active">Masuk</a>
    </nav>
    <span class="crumb">09 / LOGIN</span>
    <button class="burger" id="burger" aria-label="Buka menu">☰</button>
  </header>

  <main>
    <!-- Tampil jika belum login -->
    <section class="page authwrap panel" id="loginBox">
      <div class="auth-head">
        <a class="logo" href="index.html">RestoRasa<span>.</span></a>
        <h2>Masuk ke <em>akun.</em></h2>
        <p class="sub">Silakan login untuk melanjutkan.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="lEmail">Email</label>
          <input id="lEmail" type="email" placeholder="Masukkan email" required>
        </div>
        <div class="field">
          <label for="lPass">Password</label>
          <input id="lPass" type="password" placeholder="Masukkan password" required>
        </div>
        <div class="err" id="err"></div>
        <button class="btn orange block" type="submit">Login</button>
      </form>

      <p class="sub auth-note">Belum punya akun? <a class="link" href="register.html">Daftar di sini</a></p>
    </section>

    <!-- Tampil jika sudah login -->
    <section class="page authwrap panel profile" id="profileBox" hidden>
      <div class="thumb avatar">👤</div>
      <h2>Halo, <em id="pName">-</em></h2>
      <p class="lead" id="pEmail"></p>
      <button class="btn ghost block" id="logoutBtn">Keluar</button>
    </section>
  </main>

  <footer class="foot">
    <a class="logo" href="index.html">RestoRasa<span>.</span></a>
    <p>Jl. Merdeka No. 123, Cilegon · Buka 10.00 – 22.00 WIB · +62 812 3456 7890</p>
    <span class="mono">© 2026 RestoRasa</span>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
