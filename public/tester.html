<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester - GET, POST, PUT, DELETE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Auth Configuration -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">API Testing Console</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Base URL</label>
                    <input type="text" id="baseUrl" value="http://192.168.1.10:3000" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">X-Sesion-ID Header</label>
                    <input type="text" id="sessionId" placeholder="1f4d6a86791267" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
        </div>

        <!-- Request Builder -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Kirim Request</h2>
            
            <div class="flex flex-col md:flex-row gap-3 mb-4">
                <!-- Method Selection -->
                <select id="httpMethod" class="p-2 border border-gray-300 rounded font-semibold text-gray-700 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>

                <!-- Endpoint Input -->
                <input type="text" id="endpoint" value="/api/sawah" placeholder="/api/sawah" class="flex-grow p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                
                <!-- Send Button -->
                <button onclick="sendRequest()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition duration-150">
                    Kirim
                </button>
            </div>

            <!-- GET Query Parameters -->
            <div id="querySection" class="p-4 bg-gray-50 rounded border border-gray-200 mb-4">
                <h3 class="text-sm font-medium text-gray-700 mb-2">Query Parameters (GET)</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-gray-500">Page</label>
                        <input type="number" id="paramPage" placeholder="0" class="w-full p-2 border border-gray-300 rounded bg-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">Size</label>
                        <input type="number" id="paramSize" placeholder="10" class="w-full p-2 border border-gray-300 rounded bg-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">Search Keyword</label>
                        <input type="text" id="paramSearch" placeholder="Cari..." class="w-full p-2 border border-gray-300 rounded bg-white text-sm">
                    </div>
                </div>
            </div>

            <!-- Request Body (JSON) -->
            <div id="bodySection" class="hidden">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700">Request Body (JSON)</label>
                    <span id="bodyHint" class="text-xs text-gray-500"></span>
                </div>
                <textarea id="requestBody" rows="6" class="w-full p-3 border border-gray-300 rounded font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>
        </div>

        <!-- Response Output -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-semibold text-gray-700">Response Server</h2>
                <div id="statusBadge" class="hidden px-3 py-1 rounded text-sm font-bold"></div>
            </div>
            
            <pre id="responseOutput" class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm overflow-x-auto min-h-[150px]">Respon akan ditampilkan di sini...</pre>
        </div>

    </div>

    <script>
        const methodSelect = document.getElementById('httpMethod');
        const querySection = document.getElementById('querySection');
        const bodySection = document.getElementById('bodySection');
        const bodyInput = document.getElementById('requestBody');
        const bodyHint = document.getElementById('bodyHint');

        // Default JSON templates for each HTTP Method based on specification
        const bodyTemplates = {
            POST: `[\n  {\n    "id": null,\n    "nama": "Sawah Baru",\n    "luas": 12\n  }\n]`,
            PUT: `[\n  "769",\n  "770"\n]`,
            DELETE: `[\n  {\n    "id": "769"\n  }\n]`
        };

        const bodyHints = {
            POST: "Harus berupa Array of Objects",
            PUT: "Harus berupa Array of Strings (kumpulan ID)",
            DELETE: "Harus berupa Array of Objects (berisi ID)"
        };

        // Switch UI controls depending on selected method
        methodSelect.addEventListener('change', () => {
            const method = methodSelect.value;
            if (method === 'GET') {
                querySection.classList.remove('hidden');
                bodySection.classList.add('hidden');
            } else {
                querySection.classList.add('hidden');
                bodySection.classList.remove('hidden');
                bodyInput.value = bodyTemplates[method] || '';
                bodyHint.innerText = bodyHints[method] || '';
            }
        });

        async function sendRequest() {
            const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
            const endpoint = document.getElementById('endpoint').value.replace(/^\//, '');
            const sessionId = document.getElementById('sessionId').value.trim();
            const method = methodSelect.value;
            
            const responseOutput = document.getElementById('responseOutput');
            const statusBadge = document.getElementById('statusBadge');

            let url = `${baseUrl}/${endpoint}`;

            // Build Query String for GET
            if (method === 'GET') {
                const params = new URLSearchParams();
                const page = document.getElementById('paramPage').value;
                const size = document.getElementById('paramSize').value;
                const search = document.getElementById('paramSearch').value;

                if (page !== '') params.append('page', page);
                if (size !== '') params.append('size', size);
                if (search !== '') params.append('search', search);

                const queryString = params.toString();
                if (queryString) {
                    url += `?${queryString}`;
                }
            }

            // Headers Setup
            const headers = {};
            if (sessionId) {
                headers['X-Sesion-ID'] = sessionId;
            }

            const options = {
                method: method,
                headers: headers
            };

            // Process Request Body for non-GET
            if (method !== 'GET') {
                headers['Content-Type'] = 'application/json';
                try {
                    const rawBody = bodyInput.value;
                    if (rawBody.trim() !== "") {
                        options.body = JSON.stringify(JSON.parse(rawBody));
                    }
                } catch (e) {
                    alert('Format JSON pada Body tidak valid!');
                    return;
                }
            }

            responseOutput.textContent = "Mengirim request...";
            statusBadge.classList.add('hidden');

            try {
                const response = await fetch(url, options);
                const data = await response.json();

                // Display Status Code Badge
                statusBadge.textContent = `${response.status} ${response.statusText}`;
                statusBadge.className = 'px-3 py-1 rounded text-sm font-bold ' + 
                    (response.ok ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300');
                statusBadge.classList.remove('hidden');

                // Display JSON Result
                responseOutput.textContent = JSON.stringify(data, null, 4);
            } catch (err) {
                statusBadge.textContent = "Error";
                statusBadge.className = 'px-3 py-1 rounded text-sm font-bold bg-red-100 text-red-800 border border-red-300';
                statusBadge.classList.remove('hidden');
                responseOutput.textContent = `Fetch Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
